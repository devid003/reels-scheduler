<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}Reels Scheduler{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234c7dff'/%3E%3Cpath d='M16 7a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm1 9.6V11h-2v6.4l4.6 2.7 1-1.7z' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0e1117;--surface:#151a24;--raise:#1c2230;--line:#262e3f;--line2:#323b4f;
  --ink:#eef1f6;--soft:#c9d0dc;--muted:#97a1b4;--faint:#6b7488;
  --accent:#4c7dff;--accent2:#7a9dff;--time:#f2b84b;--ok:#3ccf8e;--bad:#ff7a7a;--warn:#f2b84b;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent2)}
.bar{position:sticky;top:0;z-index:20;background:rgba(14,17,23,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1240px;margin:0 auto;padding:0 20px;height:60px;display:flex;align-items:center;gap:22px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;color:var(--ink);text-decoration:none;font-size:16px}
.brand i{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;font-style:normal}
.tabs{display:flex;gap:4px;height:100%}
.tabs a{display:flex;align-items:center;padding:0 12px;color:var(--muted);text-decoration:none;font-weight:600;font-size:14.5px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.bar .sp{flex:1}
.wrap{max-width:1240px;margin:0 auto;padding:26px 20px 70px}
h1{font-size:24px;letter-spacing:-.02em;margin:0 0 4px;line-height:1.25}
h2{font-size:17px;margin:0;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.panel-h{padding:18px 20px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.panel-h p{margin:3px 0 0;color:var(--muted);font-size:13.5px}
.panel-b{padding:16px 20px 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line2);
  background:transparent;color:var(--ink);font:inherit;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--raise)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#3f6ff0}
.btn.sm{height:32px;padding:0 11px;font-size:13px;border-radius:8px}
.btn.bad{color:var(--bad)}
.btn:disabled{opacity:.55;cursor:default}
.btn:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
input[type=text],input[type=password],textarea,select{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:10px;color:var(--ink);
  font:inherit;font-size:14.5px;padding:9px 12px;outline:none}
input[type=text]:focus,input[type=password]:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:70px;line-height:1.45}
label.f{display:block;font-size:13px;font-weight:600;color:var(--soft)}
label.f>input,label.f>textarea{margin-top:6px}
.muted{color:var(--muted)}.small{font-size:13px}
.flash{max-width:1240px;margin:16px auto -6px;padding:0 20px}
.flash div{background:var(--raise);border:1px solid var(--line2);border-radius:10px;padding:11px 14px;font-size:14px}
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;border:1px solid var(--line2);color:var(--soft)}
.badge.ok{color:var(--ok);border-color:rgba(60,207,142,.35);background:rgba(60,207,142,.08)}
.badge.time{color:var(--time);border-color:rgba(242,184,75,.35);background:rgba(242,184,75,.08)}
.badge.bad{color:var(--bad);border-color:rgba(255,122,122,.35);background:rgba(255,122,122,.08)}
.badge.go{color:var(--accent2);border-color:rgba(76,125,255,.4);background:rgba(76,125,255,.1)}
.av{width:28px;height:28px;border-radius:50%;object-fit:cover;background:var(--raise);flex:none}
.av.ph{display:grid;place-items:center;font-size:12px;font-weight:700;font-style:normal;color:var(--muted)}
form.inline{display:inline}
.empty{padding:28px 20px;color:var(--muted);text-align:center;font-size:14px}
@media (max-width:640px){.bar-in{gap:12px;padding:0 14px}.brand span{display:none}.wrap{padding:18px 14px 60px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<script>document.addEventListener('error',function(e){var t=e.target;if(!t||t.tagName!=='IMG'||!t.classList.contains('av'))return;var s=document.createElement('span');s.className='av ph';s.textContent=t.getAttribute('data-l')||'';s.setAttribute('aria-hidden','true');t.replaceWith(s);},true);</script>
{% block head %}{% endblock %}
</head>
<body>
{% if request.session.get('ok') %}
<header class="bar"><div class="bar-in">
  <a class="brand" href="/"><i aria-hidden="true"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></i><span>Reels Scheduler</span></a>
  <nav class="tabs" aria-label="Sections">
    <a href="/"{% if nav == '/' %} aria-current="page"{% endif %}>Queue</a>
    <a href="/pages"{% if nav == '/pages' %} aria-current="page"{% endif %}>Pages</a>
    <a href="/analytics"{% if nav.startswith('/analytics') %} aria-current="page"{% endif %}>Analytics</a>
  </nav>
  <span class="sp"></span>
  <form method="post" action="/logout" class="inline"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="btn sm">Log out</button></form>
</div></header>
{% endif %}
{% if flash %}<div class="flash" role="status"><div>{{ flash }}</div></div>{% endif %}
{% block body %}{% endblock %}
</body>
</html>
