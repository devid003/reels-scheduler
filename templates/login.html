{% extends "base.html" %}
{% block title %}Log in to Reels Scheduler{% endblock %}
{% block body %}
<main style="min-height:80vh;display:grid;place-items:center;padding:20px">
  <form method="post" action="/login" class="panel" style="width:100%;max-width:380px;padding:28px">
    <div class="brand" style="margin-bottom:18px"><i aria-hidden="true"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></i>Reels Scheduler</div>
    <input type="hidden" name="csrf" value="{{ csrf }}">
    {% if need_pw %}<p class="small" style="color:var(--warn);margin:0 0 14px">Add ADMIN_PASSWORD on Render first, then log in with it.</p>{% endif %}
    <label class="f">Password<input type="password" name="password" autocomplete="current-password" required autofocus></label>
    <button class="btn primary" style="width:100%;margin-top:16px;height:44px">Log in</button>
  </form>
</main>
{% endblock %}
